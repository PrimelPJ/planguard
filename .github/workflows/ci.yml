name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .
      - run: python -m unittest discover -s tests -t . -v
      - run: python scripts/rules_doc.py --check
      - name: Secure example passes
        run: planguard scan examples/secure-plan.json --fail-on low
      - name: Insecure example fails
        run: |
          if planguard scan examples/insecure-plan.json; then
            echo "expected the insecure plan to fail"; exit 1
          fi

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the action on the example plan
        uses: ./
        with:
          plan: examples/insecure-plan.json
          config: examples/planguard.toml
          format: markdown
          output: report.md
          fail-on: none
      - run: cat report.md >> "$GITHUB_STEP_SUMMARY"
